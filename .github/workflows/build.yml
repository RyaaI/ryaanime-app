name: Build RyaaNime APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          flutter create . --project-name ryaanime --org com.ryaal.ryaanime
          awk 'NR==1{print; print "    <uses-permission android:name=\"android.permission.INTERNET\"/>"; next}1' android/app/src/main/AndroidManifest.xml > tmp.xml && mv tmp.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="ryaanime"/android:label="RyaaNime"/g' android/app/src/main/AndroidManifest.xml
          python3 -c 'import urllib.request, json; d=json.loads(urllib.request.urlopen("https://jikan.moe").read()); urllib.request.urlretrieve(d["data"]["images"]["jpg"]["image_url"], "assets/icon.png")'
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: RyaaNime-APK
          path: build/app/outputs/flutter-apk/app-release.apk
